name: iOS Unit Tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keyed by SHA on push, by ref on pull request.
  #
  # `cancel-in-progress: false` was already set for pushes, and it was not
  # enough: it only governs runs that have *started*. GitHub separately evicts
  # an already-queued run when a newer one joins the same concurrency group, and
  # with the group keyed by ref every commit on main shared one group. So a
  # rapid series of pushes left the intermediate commits cancelled while queued
  # — which is the exact failure the comment here previously claimed to have
  # fixed. Six consecutive pushes produced four cancelled runs.
  #
  # Every commit on main is a release candidate whose .xcresult is retained as
  # evidence, so each SHA gets its own group and nothing supersedes anything.
  # Pull requests still collapse to the latest push on the branch, where
  # superseding is free.
  group: ios-tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Build, Run XCTest, and Verify Release Build
    # Pinned: macos-latest can silently move to a new macOS/Xcode image and
    # break the build with zero repo changes. Bump deliberately, with the
    # toolchain report below as the evidence of what changed.
    runs-on: macos-15
    timeout-minutes: 35
    env:
      RESULT_BUNDLE: ProceduresTests.xcresult
      XCODE_LOG: xcodebuild-test.log
      RELEASE_LOG: xcodebuild-release.log
      DERIVED_DATA: ProceduresDerivedData

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify project source membership
        run: python3 scripts/verify_xcode_project.py

      # Review state has one source of truth, and a single careless line in a
      # new view can silently restore the old behaviour where a screen knows
      # only what shipped and not what the reader signed off. Nothing would
      # fail; the screen would just be quietly wrong. So it fails here.
      - name: Verify review-state invariants
        run: python3 scripts/check_review_state_sources.py

      - name: Report Xcode toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun simctl list runtimes
          xcrun simctl list devices available -j > simulator-inventory.json

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          udid="$(python3 - <<'PY'
          import json
          import re
          import subprocess

          payload = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"],
              text=True,
          ))
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              version = tuple(int(part) for part in re.findall(r"\d+", runtime))
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator was found on the runner")
          candidates.sort(reverse=True)
          print(candidates[0][2])
          PY
          )"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b

      - name: Run XCTest with result bundle
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Procedures.xcodeproj \
            -scheme Procedures \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -destination-timeout 120 \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -skipMacroValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$XCODE_LOG"

      - name: Require executed tests
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path "$RESULT_BUNDLE" \
            --format json > test-summary.json
          expected="$(python3 scripts/verify_xcode_project.py --test-count-only)"
          python3 scripts/verify_xcresult_summary.py \
            test-summary.json \
            --expected "$expected"

      - name: Verify Release configuration builds
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Procedures.xcodeproj \
            -scheme Procedures \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            -skipMacroValidation \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RELEASE_LOG"

      # The Python suite covers the content validator, the export/apply
      # round-trips, and the repo guards. It ran only on a developer machine, so
      # nothing verified it on the way to main.
      #
      # Placed after the Xcode work on purpose. An earlier attempt put it first
      # and a pip failure skipped every Swift step, so a run that should have
      # verified the build verified nothing and uploaded no evidence. Anything
      # that can fail for environmental reasons goes after the thing it must not
      # be able to mask.
      #
      # A virtualenv because the runner's Python is Homebrew-managed and rejects
      # `pip install` outright under PEP 668. --break-system-packages would work
      # and would also let a dependency quietly alter the runner's Python.
      - name: Run repository test suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --quiet --disable-pip-version-check \
            -r scripts/requirements-validation.txt
          .ci-venv/bin/python -m unittest discover \
            --start-directory scripts/tests --pattern 'test_*.py' --verbose
          .ci-venv/bin/python scripts/validate_procedures.py

      - name: Upload Xcode evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: procedures-xcode-evidence-${{ github.run_id }}
          # The release constitution requires the .xcresult bundle as
          # retained evidence; 'warn' let missing evidence pass as green.
          if-no-files-found: error
          # Release evidence must outlive the default window; 90 days is the
          # maximum GitHub allows for this repository.
          retention-days: 90
          path: |
            ProceduresTests.xcresult
            test-summary.json
            simulator-inventory.json
            xcodebuild-test.log
            xcodebuild-release.log
