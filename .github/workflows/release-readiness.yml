name: Release Readiness

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ios-evidence:
    name: Reuse iOS Build and XCTest Gate
    uses: ./.github/workflows/ios-tests.yml

  clinical-release-gate:
    name: Strict Clinical Release Gate
    # Pinned so the release gate environment cannot drift with zero repo changes.
    runs-on: ubuntu-24.04
    steps:
      # Full history: the audit baselines are derived from the git blobs that
      # hold the audited bytes, and a shallow clone does not contain them.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install pinned validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-validation.txt

      - name: Run validator negative-control tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Verify Xcode project source membership
        run: python3 scripts/verify_xcode_project.py

      # The audit baselines must be derivable from the audited bytes. Running
      # this before the gate means a hand-edited baseline fails as tampering
      # rather than passing as a green gate.
      - name: Verify audit baselines were not hand-edited
        run: python3 scripts/generate_audit_ledger.py --check

      # The 55-procedure verification packets in docs/audits/ screened a
      # specific corpus, per record. A record whose audit-scoped content has
      # changed since then has a lane report describing text that is not
      # shipping, so releasing it ships evidence that no longer applies.
      #
      # This also refuses to pass while any procedure still carries an
      # unresolved STOP-SHIP or MAJOR disposition. Without that, satisfying the
      # fingerprints alone made the gate print "Verified ... 55 procedures" over
      # a corpus where every record was flagged — a clean bill of health for
      # exactly the records the audit objected to.
      - name: Verify audited corpus still matches the shipping corpus
        run: python3 scripts/verify_procedure_audit.py

      - name: Enforce strict clinical release policy
        run: python3 scripts/validate_procedures.py --release
