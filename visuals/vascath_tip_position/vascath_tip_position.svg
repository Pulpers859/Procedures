<g id="labels"><g class="label" data-label="Superior vena cava" data-target="svc"><polyline class="leader-halo" points="300,652 794,700"/><polyline class="leader" points="300,652 794,700"/><circle class="leader-dot" cx="794" cy="700" r="7"/><text x="40" y="640" text-anchor="start"><tspan x="40" dy="0">Superior</tspan><tspan x="40" dy="66">vena cava</tspan></text></g><g class="label emphasis" data-label="Cavoatrial junction" data-target="cavoatrial-junction"><polyline class="leader-halo" points="1210,342 1100,520 792,862"/><polyline class="leader" points="1210,342 1100,520 792,862"/><circle class="leader-dot" cx="792" cy="862" r="7"/><text x="1200" y="330" text-anchor="start"><tspan x="1200" dy="0">Cavoatrial</tspan><tspan x="1200" dy="66">junction</tspan></text></g><g class="label" data-label="Right atrium" data-target="right-atrium"><polyline class="leader-halo" points="390,1040 700,1040"/><polyline class="leader" points="390,1040 700,1040"/><circle class="leader-dot" cx="700" cy="1040" r="7"/><text x="40" y="1050" text-anchor="start"><tspan x="40" dy="0">Right atrium</tspan></text></g></g>

</svg>
