  <line x1="405.6" y1="232.4" x2="537.6" y2="256.2" stroke="#F4F6F8" stroke-width="26" stroke-linecap="round"/>
  <rect x="535.6" y="252.2" width="34" height="16" rx="5" fill="#F2F2F2" stroke="#8A9199" stroke-width="2"/>
