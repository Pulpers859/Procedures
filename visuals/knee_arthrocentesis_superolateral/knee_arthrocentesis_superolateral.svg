  <g id="dimension" stroke="#4A2F7A" stroke-width="4" fill="none">
    <line id="dim-lateral-line" x1="681.2" y1="608.1" x2="586.2" y2="608.1"/>
    <line id="dim-superior-line" x1="586.2" y1="608.1" x2="586.2" y2="513.1"/>
  </g>
  <circle cx="681.2" cy="608.1" r="7" fill="#4A2F7A"/>
