  <path id="quadriceps-tendon" d="M696,586 C677,560.7 679.5,256.7 677,206 C674.5,155.3 636.5,-148.7 658,-174 C679.5,-199.3 978.5,-199.3 1000,-174 C1021.5,-148.7 983.5,155.3 981,206 C978.5,256.7 981,560.7 962,586 C943,611.3 715,611.3 696,586 Z" fill="#EBC6AE"/>
