  <circle id="target" cx="586.2" cy="513.1" r="33.2" fill="#6CCBD2" fill-opacity="0.55" stroke="#0E8C98" stroke-width="5"/>
  <circle cx="586.2" cy="513.1" r="6" fill="#0E8C98"/>
</g>

