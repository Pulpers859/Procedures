FF" stroke-width="12" stroke-linecap="round" opacity="0.55"/><path d="M760,136 C731.1,156 621.8,194.9 586.7,256 C551.6,317.1 555.6,461.6 549.3,502.7" fill="none" stroke="#0E8C98" stroke-width="7" stroke-linecap="round"/><polygon class="arrow" points="958,649 965,694.5 926.7,682.7" fill="#0E8C98" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><polygon class="arrow" points="585.3,658.5 622.7,685.3 587.5,704.5" fill="#0E8C98" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><polygon class="arrow" points="952.7,340 918.1,309.7 954.9,294.1" fill="#0E8C98" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><polygon class="arrow" points="555.8,329.5 551.6,283.7 589.1,297.7" fill="#0E8C98" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><circle id="site-inferior" cx="810.7" cy="869.3" r="15" fill="#C8322B" stroke="#FFFFFF" stroke-width="4"/><circle id="site-superior" cx="760" cy="136" r="15" fill="#C8322B" stroke="#FFFFFF" stroke-width="4"/>
