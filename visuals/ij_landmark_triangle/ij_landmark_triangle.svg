  <path d="M1120,944 C1145,939 1215,917 1270,914 C1325,911 1390,932 1450,926 C1510,920 1565,900 1630,878 C1695,856 1775,810 1840,794 C1905,778 1990,784 2020,782" fill="none" stroke="url(#bone)" stroke-width="78" stroke-linecap="round" filter="url(#lift)"/>

  <path d="M1018,986 C1016.4,975.2 1041.2,856.4 1048,830 C1054.8,803.6 1108.8,622 1120,590 C1131.2,558 1203.2,374.8 1216,350 C1228.8,325.2 1297.6,225.2 1312,218 C1326.4,210.8 1432,225.2 1432,242 C1432,258.8 1328,434.8 1312,470 C1296,505.2 1204.4,739.2 1192,770 C1179.6,800.8 1134,917.2 1126,932 C1118,946.8 1079.2,988.4 1072,992 C1064.8,995.6 1019.6,996.8 1018,986 Z" fill="#C97A6E" fill-opacity="0.55" stroke="#9C5046" stroke-width="2.5"/>
