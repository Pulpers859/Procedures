  <path d="M604,-70 C607,-52.5 631,88 640,110 C649,132 687,183 712,194 C737,205 903.5,237 940,242 C976.5,247 1117.5,256 1150,254 C1182.5,252 1302.5,229 1330,218 C1357.5,207 1457.5,146 1480,122 C1502.5,98 1590,-51.5 1600,-70 C1610,-88.5 1683,-97.5 1600,-100 C1517,-102.5 687,-102.5 604,-100 C521,-97.5 601,-87.5 604,-70 Z" fill="url(#face)"/>
  <path id="jaw" d="M604,-70 C610,-40 622,66 640,110 C658,154 662,172 712,194 C762,216 867,232 940,242 C1013,252 1085,258 1150,254 C1215,250 1275,240 1330,218 C1385,196 1435,170 1480,122 C1525,74 1580,-38 1600,-70" fill="none" stroke="#C49580" stroke-width="5" filter="url(#lift)"/>
  <path id="ear-lobe" d="M532,-70 C517.6,-71.6 488.8,-26 484,-10 C479.2,6 486.4,40.4 496,50 C505.6,59.6 543.2,68.4 556,62 C568.8,55.6 595.2,19.6 592,2 C588.8,-15.6 546.4,-68.4 532,-70 Z" fill="#EBC3AD" stroke="#C49580" stroke-width="3"/>
  <path id="manubrium" d="M856,962 C862.4,937.2 930.4,938.4 940,938 C949.6,937.6 992,956 1000,956 C1008,956 1050.4,937.6 1060,938 C1069.6,938.4 1137.6,937.2 1144,962 C1150.4,986.8 1176,1286.8 1156,1310 C1136,1333.2 864,1333.2 844,1310 C824,1286.8 849.6,986.8 856,962 Z" fill="url(#bone)" opacity="0.7" filter="url(#lift)"/>
