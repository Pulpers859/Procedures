        stroke="#9C5046" stroke-width="3" stroke-linejoin="round" filter="url(#lift)"/>
  <g fill="#000" fill-opacity="0">
    <polygon id="sternal-head" points="982,986 952,830 916,698 784,722 820,830 874,932 928,992"/>
    <polygon id="clavicular-head" points="724,932 748,830 784,722 700,686 616,710 616,830 580,926 652,938"/>
  </g>
  <path id="external-jugular" d="M664,170 C652,205 616,305 592,380 C568,455 542,537 520,620 C498,703 470,835 460,878" fill="none" stroke="#5C84C4" stroke-width="24" stroke-linecap="round" stroke-opacity="0.9"/>

  <circle id="entry-point" class="marking" cx="784" cy="740" r="16"
          fill="#0E8C98" fill-opacity="0.35" stroke="#0E8C98" stroke-width="5"/>
</g>

<g id="labels"><g class="label" data-label="Sternal head" data-target="sternal-head"><polyline class="leader-halo" points="1175,800 940,890"/><polyline class="leader" points="1175,800 940,890"/><circle class="leader-dot" cx="940" cy="890" r="7"/><text x="1180" y="820" text-anchor="start"><tspan x="1180" dy="0">Sternal head</tspan></text></g><g class="label" data-label="Clavicular head" data-target="clavicular-head"><polyline class="leader-halo" points="300,1100 652,866"/><polyline class="leader" points="300,1100 652,866"/><circle class="leader-dot" cx="652" cy="866" r="7"/><text x="40" y="1150" text-anchor="start"><tspan x="40" dy="0">Clavicular head</tspan></text></g><g class="label emphasis" data-label="Internal jugular vein" data-target="internal-jugular"><polyline class="leader-halo" points="1175,572 784,782"/><polyline class="leader" points="1175,572 784,782"/><circle class="leader-dot" cx="784" cy="782" r="7"/><text x="1180" y="560" text-anchor="start"><tspan x="1180" dy="0">Internal</tspan><tspan x="1180" dy="66">jugular vein</tspan></text></g></g>

</svg>
