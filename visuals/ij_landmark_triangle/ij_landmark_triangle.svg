<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #F4F1EA; }</style>
<defs>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EBCBB7"/><stop offset="0.5" stop-color="#F7E6DA"/>
  <stop offset="1" stop-color="#F2DACB"/></linearGradient>
<linearGradient id="muscle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D98F83"/><stop offset="1" stop-color="#B7675C"/></linearGradient>
<linearGradient id="bone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F0E2"/><stop offset="1" stop-color="#D8CBAE"/></linearGradient>
<filter id="lift" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6B4A3C" flood-opacity="0.22"/></filter>
</defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="anatomy">
  <rect id="neck" x="-10" y="-10" width="1620" height="1220" fill="url(#skin)"/>
  <path d="M1500,1240 C1506.7,1166.7 1513.3,940 1540,800 C1566.7,660 1640,466.7 1660,400" fill="none" stroke="#D2AA94" stroke-width="4"/>
  <path d="M350,820 C350,716.7 350,303.3 350,200" stroke="#E4C6B3" stroke-width="230" stroke-linecap="round" opacity="0.45"/>
  <path d="M480,1090 C472.5,1101.2 378,1086 365,1082 C352,1078 353,1050 350,1050 C347,1050 348,1078 335,1082 C322,1086 227.5,1101.2 220,1090 C212.5,1078.8 247,988 260,970 C273,952 332,910 350,910 C368,910 427,952 440,970 C453,988 487.5,1078.8 480,1090 Z" fill="#E8CBB8" stroke="#CFA58F" stroke-width="3" opacity="0.5"/>

  <path d="M570,200 C575,233.3 589.2,321.7 600,400 C610.8,478.3 624.2,578.3 635,670 C645.8,761.7 655,855 665,950 C675,1045 690,1191.7 695,1240" fill="none" stroke="#C8322B" stroke-width="84" stroke-linecap="butt" id="carotid-artery" stroke-opacity="0.65"/>
  <path d="M724,200 C723.3,208.3 718.2,206.7 720,250 C721.8,293.3 730,390 735,460 C740,530 742.5,588.3 750,670 C757.5,751.7 768.3,855 780,950 C791.7,1045 813.3,1191.7 820,1240" fill="none" stroke="#4F78B8" stroke-width="144" stroke-linecap="butt" id="internal-jugular" stroke-opacity="0.6"/>

  <path id="manubrium" d="M570,170 C562.7,184.7 474.7,162.1 460,160 C445.3,157.9 364.7,138 350,138 C335.3,138 254.7,157.9 240,160 C225.3,162.1 137.3,184.7 130,170 C122.7,155.3 100.7,-44.7 130,-60 C159.3,-75.3 540.7,-75.3 570,-60 C599.3,-44.7 577.3,155.3 570,170 Z" fill="url(#bone)" filter="url(#lift)"/>
  <path id="clavicle" d="M590,188 C625,192.3 715,212 800,214 C885,216 1000,209 1100,200 C1200,191 1306.7,165 1400,160 C1493.3,155 1616.7,168.3 1660,170" fill="none" stroke="url(#bone)" stroke-width="140" stroke-linecap="round" filter="url(#lift)"/>
  <path d="M110,188 C75,192.3 -25,211.3 -100,214 C-175,216.7 -300,205.7 -340,204" fill="none" stroke="url(#bone)" stroke-width="140" stroke-linecap="round" filter="url(#lift)"/>

  <path id="scm" d="M435,145 C433.2,160.9 482.7,371.1 490,400 C497.3,428.9 551.2,613.8 560,640 C568.8,666.2 629.5,824.9 640,850 C650.5,875.1 730.1,1047.2 740,1070 C749.9,1092.8 784.3,1230.1 810,1240 C835.7,1249.9 1161.3,1254 1180,1240 C1198.7,1226 1136.4,1024.5 1130,1000 C1123.6,975.5 1075.2,838.7 1070,820 C1064.8,801.3 1039.4,701 1040,680 C1040.6,659 1075.9,485 1080,460 C1084.1,435 1116.4,264.9 1110,252 C1103.6,239.1 986.3,238.2 970,238 C953.7,237.8 840.8,235.1 830,248 C819.2,260.9 790.2,435.4 785,460 C779.8,484.6 746.4,670.3 740,670 C733.6,669.7 682.6,480 675,455 C667.4,430 619,261.1 610,242 C601,222.9 530.2,133.7 520,128 C509.8,122.3 436.8,129.1 435,145 Z" fill="#C97A6E" fill-opacity="0.84"
        stroke="#9C5046" stroke-width="3" stroke-linejoin="round" filter="url(#lift)"/>
  <g fill="#000" fill-opacity="0">
    <polygon id="sternal-head" points="435,145 520,128 610,242 675,455 740,670 560,640 490,400"/>
    <polygon id="clavicular-head" points="830,248 785,460 740,670 900,700 1040,680 1080,460 1110,252"/>
    <polygon id="scm-belly" points="740,670 560,640 640,850 740,1070 810,1240 1180,1240 1130,1000 1070,820 1040,680"/>
  </g>
  <path d="M265,145 C263,126.9 191.7,121.5 180,128 C168.3,134.5 100.3,220.2 90,242 C79.7,263.8 32.3,428.5 25,455 C17.7,481.5 -27.7,627.7 -20,640 C-12.3,652.3 124.7,656 140,640 C155.3,624 201.7,433 210,400 C218.3,367 267,163.1 265,145 Z" fill="#C97A6E" fill-opacity="0.8" stroke="#9C5046" stroke-width="3" filter="url(#lift)"/>
  <path d="M950,1240 C965,1191.7 1006.7,1050 1040,950 C1073.3,850 1111.7,735 1150,640 C1188.3,545 1236.7,446.7 1270,380 C1303.3,313.3 1336.7,263.3 1350,240" fill="none" stroke="#5C84C4" stroke-width="26" stroke-linecap="round" id="external-jugular" opacity="0.9"/>

  <circle id="entry-point" class="marking" cx="740" cy="648" r="20"
          fill="#0E8C98" fill-opacity="0.35" stroke="#0E8C98" stroke-width="5"/>
</g>

<g id="labels"><g class="label" data-label="Sternal head" data-target="sternal-head"><polyline class="leader-halo" points="330,556 520,380"/><polyline class="leader" points="330,556 520,380"/><circle class="leader-dot" cx="520" cy="380" r="7"/><text x="40" y="620" text-anchor="start"><tspan x="40" dy="0">Sternal head</tspan></text></g><g class="label" data-label="Clavicular head" data-target="clavicular-head"><polyline class="leader-halo" points="1240,572 940,440"/><polyline class="leader" points="1240,572 940,440"/><circle class="leader-dot" cx="940" cy="440" r="7"/><text x="1230" y="560" text-anchor="start"><tspan x="1230" dy="0">Clavicular</tspan><tspan x="1230" dy="66">head</tspan></text></g><g class="label emphasis" data-label="Internal jugular vein" data-target="internal-jugular"><polyline class="leader-halo" points="760,130 720,320"/><polyline class="leader" points="760,130 720,320"/><circle class="leader-dot" cx="720" cy="320" r="7"/><text x="560" y="110" text-anchor="start"><tspan x="560" dy="0">Internal jugular vein</tspan></text></g></g>

</svg>
