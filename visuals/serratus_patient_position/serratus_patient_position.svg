<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #3F6B6E; }</style>
<defs>
<linearGradient id="skin-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E7BFA2"/><stop offset="1" stop-color="#C9967A"/></linearGradient>
<linearGradient id="mound-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBC6AA"/><stop offset="1" stop-color="#D9A88B"/></linearGradient>
<linearGradient id="probe-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9ECEF"/><stop offset="1" stop-color="#B9C0C7"/></linearGradient>
</defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting"></g>
<g id="anatomy"><g transform="translate(-380 0)">
  <rect id="chest" x="380" y="0" width="1600" height="1200" fill="url(#skin-grad)"/>
  <path d="M-40,-40 C-6.7,-106.7 331.7,-68.3 360,-40 C388.3,-11.7 310,238.3 300,300 C290,361.7 268.3,661.7 240,700 C211.7,738.3 -16.7,821.7 -40,760 C-63.3,698.3 -73.3,26.7 -40,-40 Z" fill="#B98266" opacity="0.5"/>
  <path id="arm" d="M1180,-40 C1249.2,-55.8 1950,-85.8 2020,-40 C2090,5.8 2067.5,469.2 2020,510 C1972.5,550.8 1507.5,459.2 1450,450 C1392.5,440.8 1346.7,412.5 1330,400 C1313.3,387.5 1261.7,320.8 1250,300 C1238.3,279.2 1195.8,178.3 1190,150 C1184.2,121.7 1110.8,-24.2 1180,-40 Z" fill="#E2B497" stroke="#B98A74" stroke-width="3"/>
  <path id="axilla" d="M1190,150 C1197,167.5 1237.2,270.8 1250,300 C1262.8,329.2 1294.2,388.3 1300,400" fill="none" stroke="#A9765F" stroke-width="10" stroke-linecap="round"/>
  <path id="pec-border" d="M500,600 C520,604 660,640 700,640 C740,640 862,612 900,600 C938,588 1050,538 1080,520 C1110,502 1188,430 1200,420" fill="none" stroke="#B98A74" stroke-width="6" opacity="0.8"/>
  <circle id="nipple" cx="850" cy="470" r="22" fill="#B87F6C"/>
  <path id="drape" d="M340,900 C348,882.5 467,891.5 500,890 C533,888.5 960,872 1000,870 C1040,868 1268,852.5 1300,850 C1332,847.5 1604,823 1640,820 C1676,817 2001,769 2020,790 C2039,811 2104,1217.5 2020,1240 C1936,1262.5 424,1257 340,1240 C256,1223 332,917.5 340,900 Z" fill="#3F6B6E"/>
  <path d="M1006.8,512.6 C946.8,522.6 866.8,712.6 746.8,1240" fill="none" stroke="#E9EEF2" stroke-width="8" stroke-linecap="round"/>
  <rect x="956.8" y="501.6" width="54" height="22" rx="6" fill="#2FA58A" stroke="#1E7A66" stroke-width="2"/>
  <line id="needle" x1="1006.8" y1="512.6" x2="1260.9" y2="615.3" stroke="#8E969E" stroke-width="5"/>
  <ellipse cx="1260.9" cy="615.3" rx="12" ry="6" fill="#C9907A" opacity="0.8"/>
  <circle id="needle-entry" cx="1260.9" cy="615.3" r="5" fill="#9E6B5A"/>
  <path id="probe" d="M1264,676.9 C1263.8,681 1296.1,694.6 1299.6,695.6 C1303.1,696.7 1364.6,707.5 1369.8,708.9 C1375,710.2 1424.8,724.8 1455.5,737 C1486.1,749.2 2261.1,1065.4 2289.9,1074.2 C2318.7,1082.9 2346.7,1013.7 2319.9,1000 C2293.1,986.3 1515.9,675.4 1485.4,662.8 C1454.9,650.3 1408.9,626.2 1404.2,623.6 C1399.5,620.9 1347.8,586 1344.6,584.4 C1341.3,582.7 1308.7,570 1306,573.1 C1303.3,576.2 1264.2,672.8 1264,676.9 Z" fill="url(#probe-body)" stroke="#7D868F" stroke-width="3"/>
  <polygon id="probe-head" points="1294.9,568.6 1306,573.1 1264,676.9 1252.9,672.4" fill="#C9D0D6" stroke="#7D868F" stroke-width="3"/>
  <polygon points="1373.7,645.7 1465.7,685 1456.7,707.3 1363.2,671.7" fill="#D3D8DD" stroke="#A9B0B7" stroke-width="2"/>
</g></g>


<g class="marking" transform="translate(-380 0)">
  <line id="mal" x1="1300" y1="420" x2="1300" y2="840" stroke="#4A2F7A" stroke-width="6" stroke-dasharray="18 12"/>
</g>

<g id="labels"><g class="label" data-label="Linear probe" data-target="probe"><polyline class="leader-halo" points="1200,960 1275.9,774.8"/><polyline class="leader" points="1200,960 1275.9,774.8"/><circle class="leader-dot" cx="1275.9" cy="774.8" r="7"/><text x="1180" y="1000" text-anchor="start"><tspan x="1180" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="300,720 753.9,563.9"/><polyline class="leader" points="300,720 753.9,563.9"/><circle class="leader-dot" cx="753.9" cy="563.9" r="7"/><text x="40" y="760" text-anchor="start"><tspan x="40" dy="0">Block needle</tspan></text></g><g class="label" data-label="Axilla" data-target="axilla"><polyline class="leader-halo" points="760,220 870,300"/><polyline class="leader" points="760,220 870,300"/><circle class="leader-dot" cx="870" cy="300" r="7"/><text x="600" y="200" text-anchor="start"><tspan x="600" dy="0">Axilla</tspan></text></g><g class="label" data-label="Mid-axillary line" data-target="mal"><polyline class="leader-halo" points="1050,1080 920,790"/><polyline class="leader" points="1050,1080 920,790"/><circle class="leader-dot" cx="920" cy="790" r="7"/><text x="980" y="1120" text-anchor="start"><tspan x="980" dy="0">Mid-axillary line</tspan></text></g></g>

</svg>
