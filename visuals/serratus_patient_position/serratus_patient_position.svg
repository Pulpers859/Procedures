<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #D3DDE6; }</style>
<defs>
<linearGradient id="skin-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ECC8AE"/><stop offset="1" stop-color="#C9967A"/></linearGradient>
<linearGradient id="probe-body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9C0C7"/><stop offset="0.5" stop-color="#E9ECEF"/>
  <stop offset="1" stop-color="#C3CAD1"/></linearGradient>
</defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting"></g>
<g id="anatomy">
  <rect id="chest" x="0" y="0" width="1600" height="1200" fill="url(#skin-grad)"/>
  <path id="breast" d="M-40,380 C-20,362.5 158.3,336.7 200,330 C241.7,323.3 418.3,299.2 460,300 C501.7,300.8 666.7,328.3 700,340 C733.3,351.7 843.3,425 860,440 C876.7,455 908.3,511.7 900,520 C891.7,528.3 791.7,541.7 760,540 C728.3,538.3 561.7,503.3 520,500 C478.3,496.7 306.7,496.7 260,500 C213.3,503.3 -15,550 -40,540 C-65,530 -60,397.5 -40,380 Z" fill="#E9C2A6" stroke="#B98A74" stroke-width="3"/>
  <path d="M1180,120 C1189.3,136.3 1246,225 1260,260 C1274,295 1295.3,401.3 1300,420" fill="none" stroke="#A9765F" stroke-width="7"/>
  <path d="M1300,420 C1303.5,452.7 1324.2,632.3 1330,700 C1335.8,767.7 1347.7,965 1350,1000" fill="none" stroke="#B98A74" stroke-width="5" opacity="0.7"/>
  <path id="drape" d="M-40,1040 C-10.7,1024 337.3,1004 400,1000 C462.7,996 840,980 900,980 C960,980 1250.7,996 1300,1000 C1349.3,1004 1617.3,1024 1640,1040 C1662.7,1056 1752,1226.7 1640,1240 C1528,1253.3 72,1253.3 -40,1240 C-152,1226.7 -69.3,1056 -40,1040 Z" fill="#5E8C8A"/>
  <path d="M310,630 C250,610 190,830 110,1240" fill="none" stroke="#E9EEF2" stroke-width="8" stroke-linecap="round"/>
  <rect x="264" y="620" width="50" height="20" rx="6" fill="#2FA58A" stroke="#1E7A66" stroke-width="2" transform="rotate(16 310 630)"/>
  <line id="needle" x1="310" y1="630" x2="605" y2="714" stroke="#8E969E" stroke-width="5"/>
  <circle id="needle-entry" cx="605" cy="714" r="5" fill="#9E6B5A"/>
  <path id="probe-handle" d="M670,740 C668.8,726.7 872.9,728.3 890,740 C907.1,751.7 1062.9,999.2 1080,1020 C1097.1,1040.8 1297.5,1230.8 1300,1240 C1302.5,1249.2 1155.8,1247.5 1140,1240 C1124.2,1232.5 939.6,1080.8 920,1060 C900.4,1039.2 671.2,753.3 670,740 Z" fill="url(#probe-body)" stroke="#7D868F" stroke-width="3"/>
  <polygon id="probe" points="650,690 910,690 910,750 650,750" fill="#D5DADF" stroke="#7D868F" stroke-width="3"/>
</g>

<g class="marking">
  <line id="mal" x1="780" y1="140" x2="780" y2="960" stroke="#4A2F7A" stroke-width="6" stroke-dasharray="18 12"/>
</g>

<g id="labels"><g class="label" data-label="Mid-axillary line" data-target="mal"><polyline class="leader-halo" points="880,140 780,300"/><polyline class="leader" points="880,140 780,300"/><circle class="leader-dot" cx="780" cy="300" r="7"/><text x="860" y="120" text-anchor="start"><tspan x="860" dy="0">Mid-axillary line</tspan></text></g><g class="label" data-label="Linear probe" data-target="probe-handle"><polyline class="leader-halo" points="1190,720 980,940"/><polyline class="leader" points="1190,720 980,940"/><circle class="leader-dot" cx="980" cy="940" r="7"/><text x="1180" y="760" text-anchor="start"><tspan x="1180" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="260,820 457.5,672"/><polyline class="leader" points="260,820 457.5,672"/><circle class="leader-dot" cx="457.5" cy="672" r="7"/><text x="40" y="860" text-anchor="start"><tspan x="40" dy="0">Block needle</tspan></text></g></g>

</svg>
