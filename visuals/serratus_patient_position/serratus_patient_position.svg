<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #6FA3A8; }</style>
<defs>
<linearGradient id="probe-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C7CDD3"/><stop offset="0.45" stop-color="#F4F6F8"/>
  <stop offset="1" stop-color="#B9C0C7"/></linearGradient>
<linearGradient id="g-steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F6F8"/><stop offset="0.5" stop-color="#B9C0C7"/>
  <stop offset="1" stop-color="#6E777F"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting" data-base-sha256="de6a2e294895e310443a853d2063831343f3f857d343be3c8481738325a9325d"><image href="base.jpg" x="0" y="1.7" width="1600" height="1196.7" preserveAspectRatio="none"/></g>
<g id="anatomy">
  <rect id="chest" x="0" y="0" width="1600" height="1200" fill="#000" opacity="0"/>
</g>

<g class="marking">
  <line id="mal" x1="1000" y1="600" x2="250" y2="856" stroke="#4A2F7A" stroke-width="6" stroke-dasharray="18 12"/>
  <circle id="axilla-mark" cx="990" cy="570" r="50" fill="#000" opacity="0"/>
  <path d="M626.6,854.3 C686.6,994.3 846.6,1084.3 1146.6,1240" fill="none" stroke="#2E3338" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
  <path d="M480.6,422.4 C420.6,382.4 300.6,542.4 200.6,1240" fill="none" stroke="#E6EEF2" stroke-width="9" stroke-linecap="round" opacity="0.9"/>
  <g transform="translate(592 752) rotate(71.3)">
    <rect x="-132" y="-48" width="264" height="96" rx="34"
          fill="#E8F2F6" opacity="0.18" filter="url(#soft)"/>
    <rect x="-108" y="-22" width="236" height="72" rx="26" fill="#1B2733"
          opacity="0.28" filter="url(#soft)"/>
    <rect id="probe" x="-118" y="-36" width="236" height="72" rx="26"
          fill="url(#probe-top)" stroke="#7D868F" stroke-width="3"/>
    <rect x="-80" y="-24" width="160" height="48" rx="16"
          fill="none" stroke="#A9B0B7" stroke-width="2"/>
    <rect x="-100" y="-4" width="20" height="8" rx="4" fill="#8E969E"/>
  </g>
  <rect x="450.6" y="412.4" width="44" height="20" rx="6" fill="#2FA58A" stroke="#1E7A66" stroke-width="2"
        transform="rotate(71.3 480.6 422.4)"/>
  <line id="needle" x1="480.6" y1="422.4" x2="549.1" y2="625.1" stroke="url(#g-steel)" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="549.1" cy="625.1" rx="9" ry="6" fill="#B07A66" opacity="0.7" transform="rotate(71.3 549.1 625.1)"/>
  <circle id="needle-entry" cx="549.1" cy="625.1" r="3" fill="#8A5A4A"/>
</g>

<g id="labels"><g class="label" data-label="Axilla" data-target="axilla-mark"><polyline class="leader-halo" points="1190,440 1010,570"/><polyline class="leader" points="1190,440 1010,570"/><circle class="leader-dot" cx="1010" cy="570" r="7"/><text x="1180" y="420" text-anchor="start"><tspan x="1180" dy="0">Axilla</tspan></text></g><g class="label" data-label="Mid-axillary line" data-target="mal"><polyline class="leader-halo" points="300,960 400,805"/><polyline class="leader" points="300,960 400,805"/><circle class="leader-dot" cx="400" cy="805" r="7"/><text x="40" y="1000" text-anchor="start"><tspan x="40" dy="0">Mid-axillary line</tspan></text></g><g class="label" data-label="Linear probe" data-target="probe"><polyline class="leader-halo" points="800,960 640.9,809.3"/><polyline class="leader" points="800,960 640.9,809.3"/><circle class="leader-dot" cx="640.9" cy="809.3" r="7"/><text x="780" y="1000" text-anchor="start"><tspan x="780" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="580,440 514.9,523.8"/><polyline class="leader" points="580,440 514.9,523.8"/><circle class="leader-dot" cx="514.9" cy="523.8" r="7"/><text x="560" y="420" text-anchor="start"><tspan x="560" dy="0">Block needle</tspan></text></g></g>

</svg>
