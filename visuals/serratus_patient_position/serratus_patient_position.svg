  <rect x="396" y="610" width="48" height="20" rx="6" fill="#2FA58A" stroke="#1E7A66" stroke-width="2"/>
  <line id="needle" x1="440" y1="620" x2="710" y2="640" stroke="#8E969E" stroke-width="5"/>
