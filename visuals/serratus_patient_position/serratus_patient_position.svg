<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #3F6B6E; }</style>
<defs>
<linearGradient id="skin-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E7BFA2"/><stop offset="1" stop-color="#C9967A"/></linearGradient>
<linearGradient id="mound-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBC6AA"/><stop offset="1" stop-color="#D9A88B"/></linearGradient>
<linearGradient id="probe-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9ECEF"/><stop offset="1" stop-color="#B9C0C7"/></linearGradient>
</defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting"></g>
<g id="anatomy">
  <rect id="chest" x="0" y="0" width="1600" height="1200" fill="url(#skin-grad)"/>
  <path d="M-40,-40 C-27.5,-106.7 99.2,-68.3 110,-40 C120.8,-11.7 93.3,238.3 90,300 C86.7,361.7 80.8,661.7 70,700 C59.2,738.3 -30.8,821.7 -40,760 C-49.2,698.3 -52.5,26.7 -40,-40 Z" fill="#B98266" opacity="0.5"/>
  <path id="arm" d="M800,-40 C869.2,-55.8 1570,-82.5 1640,-40 C1710,2.5 1687.5,429.2 1640,470 C1592.5,510.8 1127.5,455.8 1070,450 C1012.5,444.2 966.7,412.5 950,400 C933.3,387.5 881.7,320.8 870,300 C858.3,279.2 815.8,178.3 810,150 C804.2,121.7 730.8,-24.2 800,-40 Z" fill="#E2B497" stroke="#B98A74" stroke-width="3"/>
  <path id="axilla" d="M810,150 C817,167.5 857.2,270.8 870,300 C882.8,329.2 914.2,388.3 920,400" fill="none" stroke="#A9765F" stroke-width="10" stroke-linecap="round"/>
  <path id="pec-border" d="M120,600 C140,604 280,640 320,640 C360,640 482,612 520,600 C558,588 670,538 700,520 C730,502 808,430 820,420" fill="none" stroke="#B98A74" stroke-width="6" opacity="0.8"/>
  <circle id="nipple" cx="470" cy="470" r="22" fill="#B87F6C"/>
  <path id="drape" d="M-40,900 C-32,882.5 87,891.5 120,890 C153,888.5 580,872 620,870 C660,868 869,852.5 920,850 C971,847.5 1604,800.5 1640,820 C1676,839.5 1724,1219 1640,1240 C1556,1261 44,1257 -40,1240 C-124,1223 -48,917.5 -40,900 Z" fill="#3F6B6E"/>
  <path d="M500,612 C440,622 360,812 240,1240" fill="none" stroke="#E9EEF2" stroke-width="8" stroke-linecap="round"/>
  <rect x="450" y="601" width="54" height="22" rx="6" fill="#2FA58A" stroke="#1E7A66" stroke-width="2"/>
  <line id="needle" x1="500" y1="612" x2="852" y2="625" stroke="#8E969E" stroke-width="5"/>
  <circle id="needle-entry" cx="852" cy="625" r="5" fill="#9E6B5A"/>
  <path id="probe" d="M920,565 C923,558.2 974,550.6 980,550 C986,549.4 1007,550.5 1040,553 C1073,555.5 1610,590.6 1640,600 C1670,609.4 1670,735.2 1640,740 C1610,744.8 1073,697 1040,695 C1007,693 986,699.5 980,699 C974,698.5 923,691.7 920,685 C917,678.3 917,571.8 920,565 Z" fill="url(#probe-body)" stroke="#7D868F" stroke-width="3"/>
  <polygon id="probe-head" points="890,563 920,559 920,691 890,687" fill="#C9D0D6" stroke="#7D868F" stroke-width="3"/>
</g>

<g class="marking">
  <line id="mal" x1="920" y1="420" x2="920" y2="840" stroke="#4A2F7A" stroke-width="6" stroke-dasharray="18 12"/>
</g>

<g id="labels"><g class="label" data-label="Linear probe" data-target="probe"><polyline class="leader-halo" points="1180,840 1150,680"/><polyline class="leader" points="1180,840 1150,680"/><circle class="leader-dot" cx="1150" cy="680" r="7"/><text x="1100" y="880" text-anchor="start"><tspan x="1100" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="300,720 676,618.5"/><polyline class="leader" points="300,720 676,618.5"/><circle class="leader-dot" cx="676" cy="618.5" r="7"/><text x="40" y="760" text-anchor="start"><tspan x="40" dy="0">Block needle</tspan></text></g><g class="label" data-label="Axilla" data-target="axilla"><polyline class="leader-halo" points="760,220 870,300"/><polyline class="leader" points="760,220 870,300"/><circle class="leader-dot" cx="870" cy="300" r="7"/><text x="600" y="200" text-anchor="start"><tspan x="600" dy="0">Axilla</tspan></text></g><g class="label" data-label="Mid-axillary line" data-target="mal"><polyline class="leader-halo" points="1050,1080 920,790"/><polyline class="leader" points="1050,1080 920,790"/><circle class="leader-dot" cx="920" cy="790" r="7"/><text x="980" y="1120" text-anchor="start"><tspan x="980" dy="0">Mid-axillary line</tspan></text></g></g>

</svg>
