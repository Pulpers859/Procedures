  <path d="M860,-40 C870,-100 980,-140 1060,-160" fill="none" stroke="#3E454C" stroke-width="18"/>
  <path id="probe-handle" d="M770,620 C776.7,633.3 943.3,633.3 950,620 C956.7,606.7 931.2,327.5 930,300 C928.8,272.5 925.4,-25.8 920,-40 C914.6,-54.2 805.4,-54.2 800,-40 C794.6,-25.8 791.2,272.5 790,300 C788.8,327.5 763.3,606.7 770,620 Z" fill="url(#probe-body)" stroke="#7D868F" stroke-width="3"/>
  <polygon id="probe" points="750,614 970,614 970,666 750,666" fill="#D5DADF" stroke="#7D868F" stroke-width="3"/>
</g>

<g class="marking">
  <line id="mal" x1="360" y1="660" x2="1560" y2="660" stroke="#4A2F7A" stroke-width="6" stroke-dasharray="18 12"/>
</g>

<g id="labels"><g class="label" data-label="Mid-axillary line" data-target="mal"><polyline class="leader-halo" points="1180,720 1240,660"/><polyline class="leader" points="1180,720 1240,660"/><circle class="leader-dot" cx="1240" cy="660" r="7"/><text x="1110" y="760" text-anchor="start"><tspan x="1110" dy="0">Mid-axillary line</tspan></text></g><g class="label" data-label="Linear probe" data-target="probe-handle"><polyline class="leader-halo" points="1030,190 900,300"/><polyline class="leader" points="1030,190 900,300"/><circle class="leader-dot" cx="900" cy="300" r="7"/><text x="1020" y="170" text-anchor="start"><tspan x="1020" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="260,720 575,630"/><polyline class="leader" points="260,720 575,630"/><circle class="leader-dot" cx="575" cy="630" r="7"/><text x="40" y="760" text-anchor="start"><tspan x="40" dy="0">Block needle</tspan></text></g></g>

</svg>
