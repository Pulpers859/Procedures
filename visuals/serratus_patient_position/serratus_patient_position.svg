<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #3F6B6E; }</style>
<defs>
<linearGradient id="skin-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E7BFA2"/><stop offset="1" stop-color="#C9967A"/></linearGradient>
<linearGradient id="mound-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBC6AA"/><stop offset="1" stop-color="#D9A88B"/></linearGradient>
<linearGradient id="probe-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9ECEF"/><stop offset="1" stop-color="#B9C0C7"/></linearGradient>
</defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting"></g>
<g id="anatomy">
  <rect id="chest" x="0" y="0" width="1600" height="1200" fill="url(#skin-grad)"/>
  <path d="M-40,-40 C-6.7,-106.7 331.7,-68.3 360,-40 C388.3,-11.7 310,238.3 300,300 C290,361.7 268.3,661.7 240,700 C211.7,738.3 -16.7,821.7 -40,760 C-63.3,698.3 -73.3,26.7 -40,-40 Z" fill="#B98266" opacity="0.5"/>
  <path id="arm" d="M1180,-40 C1217.5,-55.8 1601.7,-82.5 1640,-40 C1678.3,2.5 1655.8,429.2 1640,470 C1624.2,510.8 1475.8,455.8 1450,450 C1424.2,444.2 1346.7,412.5 1330,400 C1313.3,387.5 1261.7,320.8 1250,300 C1238.3,279.2 1195.8,178.3 1190,150 C1184.2,121.7 1142.5,-24.2 1180,-40 Z" fill="#E2B497" stroke="#B98A74" stroke-width="3"/>
  <path id="axilla" d="M1190,150 C1197,167.5 1237.2,270.8 1250,300 C1262.8,329.2 1294.2,388.3 1300,400" fill="none" stroke="#A9765F" stroke-width="10" stroke-linecap="round"/>
  <path id="pec-border" d="M500,600 C520,604 660,640 700,640 C740,640 862,612 900,600 C938,588 1050,538 1080,520 C1110,502 1188,430 1200,420" fill="none" stroke="#B98A74" stroke-width="6" opacity="0.8"/>
  <circle id="nipple" cx="850" cy="470" r="22" fill="#B87F6C"/>
  <path id="drape" d="M-40,900 C-13,882.5 448,891.5 500,890 C552,888.5 960,872 1000,870 C1040,868 1268,852.5 1300,850 C1332,847.5 1623,800.5 1640,820 C1657,839.5 1724,1219 1640,1240 C1556,1261 44,1257 -40,1240 C-124,1223 -67,917.5 -40,900 Z" fill="#3F6B6E"/>
  <path d="M880,612 C820,622 740,812 620,1240" fill="none" stroke="#E9EEF2" stroke-width="8" stroke-linecap="round"/>
  <rect x="830" y="601" width="54" height="22" rx="6" fill="#2FA58A" stroke="#1E7A66" stroke-width="2"/>
  <line id="needle" x1="880" y1="612" x2="1232" y2="625" stroke="#8E969E" stroke-width="5"/>
  <circle id="needle-entry" cx="1232" cy="625" r="5" fill="#9E6B5A"/>
  <path id="probe" d="M1300,565 C1303,558.2 1354,550.6 1360,550 C1366,549.4 1406,550.5 1420,553 C1434,555.5 1629,590.6 1640,600 C1651,609.4 1651,735.2 1640,740 C1629,744.8 1434,697 1420,695 C1406,693 1366,699.5 1360,699 C1354,698.5 1303,691.7 1300,685 C1297,678.3 1297,571.8 1300,565 Z" fill="url(#probe-body)" stroke="#7D868F" stroke-width="3"/>
  <polygon id="probe-head" points="1270,563 1300,559 1300,691 1270,687" fill="#C9D0D6" stroke="#7D868F" stroke-width="3"/>
</g>

<g class="marking">
  <line id="mal" x1="1300" y1="420" x2="1300" y2="840" stroke="#4A2F7A" stroke-width="6" stroke-dasharray="18 12"/>
</g>

<g id="labels"><g class="label" data-label="Linear probe" data-target="probe"><polyline class="leader-halo" points="1300,780 1500,660"/><polyline class="leader" points="1300,780 1500,660"/><circle class="leader-dot" cx="1500" cy="660" r="7"/><text x="1200" y="820" text-anchor="start"><tspan x="1200" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="300,720 1056,618.5"/><polyline class="leader" points="300,720 1056,618.5"/><circle class="leader-dot" cx="1056" cy="618.5" r="7"/><text x="40" y="760" text-anchor="start"><tspan x="40" dy="0">Block needle</tspan></text></g><g class="label" data-label="Axilla" data-target="axilla"><polyline class="leader-halo" points="1150,220 1250,300"/><polyline class="leader" points="1150,220 1250,300"/><circle class="leader-dot" cx="1250" cy="300" r="7"/><text x="1000" y="200" text-anchor="start"><tspan x="1000" dy="0">Axilla</tspan></text></g><g class="label" data-label="Mid-axillary line" data-target="mal"><polyline class="leader-halo" points="1100,1080 1300,800"/><polyline class="leader" points="1100,1080 1300,800"/><circle class="leader-dot" cx="1300" cy="800" r="7"/><text x="860" y="1120" text-anchor="start"><tspan x="860" dy="0">Mid-axillary line</tspan></text></g></g>

</svg>
