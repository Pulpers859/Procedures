<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #3F6B6E; }</style>
<defs>
<linearGradient id="skin-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E7BFA2"/><stop offset="1" stop-color="#C9967A"/></linearGradient>
<linearGradient id="mound-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBC6AA"/><stop offset="1" stop-color="#D9A88B"/></linearGradient>
<linearGradient id="probe-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9ECEF"/><stop offset="1" stop-color="#B9C0C7"/></linearGradient>
</defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting"></g>
<g id="anatomy">
  <rect id="chest" x="0" y="0" width="1600" height="1200" fill="url(#skin-grad)"/>
  <path d="M-40,-40 C-6.7,-106.7 331.7,-68.3 360,-40 C388.3,-11.7 310,238.3 300,300 C290,361.7 268.3,661.7 240,700 C211.7,738.3 -16.7,821.7 -40,760 C-63.3,698.3 -73.3,26.7 -40,-40 Z" fill="#B98266" opacity="0.5"/>
  <path id="arm" d="M1200,-40 C1237.5,-60 1603.3,-95 1640,-40 C1676.7,15 1655.8,566.7 1640,620 C1624.2,673.3 1475.8,608.3 1450,600 C1424.2,591.7 1346.7,538.3 1330,520 C1313.3,501.7 1261.7,406.7 1250,380 C1238.3,353.3 1194.2,235 1190,200 C1185.8,165 1162.5,-20 1200,-40 Z" fill="#E2B497" stroke="#B98A74" stroke-width="3"/>
  <path id="axilla" d="M1180,200 C1188.2,221 1233.7,342.7 1250,380 C1266.3,417.3 1311.8,503.7 1320,520" fill="none" stroke="#A9765F" stroke-width="10" stroke-linecap="round"/>
  <path id="breast" d="M560,700 C538,679.4 501.8,553.9 500,520 C498.2,486.1 523.5,359.3 540,330 C556.5,300.7 650.7,215.6 680,200 C709.3,184.4 828.8,159.1 860,160 C891.2,160.9 996.2,192.6 1020,210 C1043.8,227.4 1109,321.6 1120,350 C1131,378.4 1144.6,491.6 1140,520 C1135.4,548.4 1090.2,640.8 1070,660 C1049.8,679.2 950.2,722.2 920,730 C889.8,737.8 773,747.8 740,745 C707,742.2 582,720.6 560,700 Z" fill="url(#mound-grad)" stroke="#B98A74" stroke-width="3"/>
  <path id="drape" d="M-40,880 C-13,861.5 448,871 500,870 C552,869 960,862.5 1000,860 C1040,857.5 1268,825 1300,820 C1332,815 1623,739 1640,760 C1657,781 1724,1216 1640,1240 C1556,1264 44,1258 -40,1240 C-124,1222 -67,898.5 -40,880 Z" fill="#3F6B6E"/>
  <path d="M500,800 C440,810 360,1000 240,1240" fill="none" stroke="#E9EEF2" stroke-width="8" stroke-linecap="round"/>
  <rect x="450" y="789" width="54" height="22" rx="6" fill="#2FA58A" stroke="#1E7A66" stroke-width="2"/>
  <line id="needle" x1="500" y1="800" x2="860" y2="815" stroke="#8E969E" stroke-width="5"/>
  <circle id="needle-entry" cx="860" cy="815" r="5" fill="#9E6B5A"/>
  <path id="probe" d="M900,760 C903,753.2 954,745.6 960,745 C966,744.4 986,742.8 1020,748 C1054,753.2 1609,837.9 1640,850 C1671,862.1 1671,988 1640,990 C1609,992 1054,894.8 1020,890 C986,885.2 966,894.5 960,894 C954,893.5 903,886.7 900,880 C897,873.3 897,766.8 900,760 Z" fill="url(#probe-body)" stroke="#7D868F" stroke-width="3"/>
  <polygon id="probe-head" points="890,758 920,754 920,886 890,882" fill="#C9D0D6" stroke="#7D868F" stroke-width="3"/>
</g>

<g id="labels"><g class="label" data-label="Linear probe" data-target="probe"><polyline class="leader-halo" points="1250,1070 1300,880"/><polyline class="leader" points="1250,1070 1300,880"/><circle class="leader-dot" cx="1300" cy="880" r="7"/><text x="1180" y="1120" text-anchor="start"><tspan x="1180" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="300,960 680,807.5"/><polyline class="leader" points="300,960 680,807.5"/><circle class="leader-dot" cx="680" cy="807.5" r="7"/><text x="40" y="1000" text-anchor="start"><tspan x="40" dy="0">Block needle</tspan></text></g><g class="label" data-label="Axilla" data-target="axilla"><polyline class="leader-halo" points="1300,320 1250,380"/><polyline class="leader" points="1300,320 1250,380"/><circle class="leader-dot" cx="1250" cy="380" r="7"/><text x="1300" y="300" text-anchor="start"><tspan x="1300" dy="0">Axilla</tspan></text></g><g class="label" data-label="Breast" data-target="breast"><polyline class="leader-halo" points="700,140 800,300"/><polyline class="leader" points="700,140 800,300"/><circle class="leader-dot" cx="800" cy="300" r="7"/><text x="640" y="120" text-anchor="start"><tspan x="640" dy="0">Breast</tspan></text></g></g>

</svg>
