</g>

<g id="labels"><g class="label" data-label="Sheath" data-target="sheath"><polyline class="leader-halo" points="580,252 549.5,356"/><polyline class="leader" points="580,252 549.5,356"/><circle class="leader-dot" cx="549.5" cy="356" r="7"/><text x="560" y="230" text-anchor="start"><tspan x="560" dy="0">Sheath</tspan></text></g><g class="label" data-label="Skin nick" data-target="nick"><polyline class="leader-halo" points="600,484 712.4,548.4"/><polyline class="leader" points="600,484 712.4,548.4"/><circle class="leader-dot" cx="712.4" cy="548.4" r="7"/><text x="330" y="470" text-anchor="start"><tspan x="330" dy="0">Skin nick</tspan></text></g><g class="label" data-label="Dilator" data-target="dilator"><polyline class="leader-halo" points="1140,484 924.9,675"/><polyline class="leader" points="1140,484 924.9,675"/><circle class="leader-dot" cx="924.9" cy="675" r="7"/><text x="1130" y="470" text-anchor="start"><tspan x="1130" dy="0">Dilator</tspan></text></g><g class="label" data-label="Guidewire" data-target="guidewire-in-vein"><polyline class="leader-halo" points="1400,1066 1450,806"/><polyline class="leader" points="1400,1066 1450,806"/><circle class="leader-dot" cx="1450" cy="806" r="7"/><text x="1250" y="1110" text-anchor="start"><tspan x="1250" dy="0">Guidewire</tspan></text></g><g class="label" data-label="Wire tail" data-target="wire-tail"><polyline class="leader-halo" points="1100,296 1108,187"/><polyline class="leader" points="1100,296 1108,187"/><circle class="leader-dot" cx="1108" cy="187" r="7"/><text x="1040" y="340" text-anchor="start"><tspan x="1040" dy="0">Wire tail</tspan></text></g></g>

