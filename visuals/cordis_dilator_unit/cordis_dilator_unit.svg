    <rect x="-1654" y="-74" width="56" height="148" rx="6" fill="#E4E9EE" stroke="#8D98A3" stroke-width="2"/>
    <rect id="dilator-hub" x="-1876" y="-49" width="224" height="98" rx="8" fill="url(#g-dilator)" stroke="#8D98A3" stroke-width="2"/>
    <line x1="-1842.4" y1="-49" x2="-1842.4" y2="49" stroke="#A9B3BC" stroke-width="2"/><line x1="-1808.8" y1="-49" x2="-1808.8" y2="49" stroke="#A9B3BC" stroke-width="2"/><line x1="-1775.2" y1="-49" x2="-1775.2" y2="49" stroke="#A9B3BC" stroke-width="2"/></g>
  <circle id="dilator-tip" cx="1017.4" cy="756" r="5" fill="#000" opacity="0"/>
  <circle id="sheath-tip" cx="824.3" cy="594" r="5" fill="#000" opacity="0"/>
  <g id="inset">
