      <rect x="1150" y="170" width="78" height="40" rx="8" fill="url(#g-dilator)" stroke="#8D98A3" stroke-width="2"/>
      <line x1="1168" y1="170" x2="1168" y2="210" stroke="#A9B3BC" stroke-width="2"/><line x1="1186" y1="170" x2="1186" y2="210" stroke="#A9B3BC" stroke-width="2"/><line x1="1204" y1="170" x2="1204" y2="210" stroke="#A9B3BC" stroke-width="2"/>
      <path id="wire-tail" d="M1150,190 C1100,190 1060,180 1030,130 C1010,95 980,80 960,70"
