  <path d="M-515.6,-183.1 C-575.6,-103.1 -665.6,-63.1 -40,-33.1" fill="none" stroke="#A9B8C4" stroke-width="16" stroke-linecap="round" opacity="0.35" transform="translate(0 4)"/>
  <path id="guidewire-in-vein" d="M1017.4,756 C1081.7,810 1121.7,806 1191.7,806 L1640,806" fill="none" stroke="url(#g-steel)" stroke-width="12.6" stroke-linecap="round"/>
  <path d="M1017.4,756 C1081.7,810 1121.7,806 1191.7,806 L1640,806" fill="none" stroke="#6E777F" stroke-width="12.6" stroke-linecap="round" opacity="0.6"/>
  <g id="device" transform="translate(760 540) rotate(40)">
