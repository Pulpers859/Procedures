  <path id="clavicle-mark" d="M600,800 C605.8,795.1 637.2,769.4 650,758 C662.8,746.6 696,714 710,702 C724,690 754.8,664 770,655 C785.2,646 831.8,628.5 840,625" fill="none" stroke="#4A2F7A" stroke-width="6" stroke-dasharray="18 12"/>
