  <circle cx="1480" cy="760" r="22" fill="#B87F6C"/>
  <path d="M400,520 C320,530 260,680 110,1240" fill="none" stroke="#E9EEF2" stroke-width="8" stroke-linecap="round"/>
  <rect x="378" y="511" width="44" height="18" rx="6" fill="#F2F2F2" stroke="#8A9199" stroke-width="2" transform="rotate(46 400 520)"/>
