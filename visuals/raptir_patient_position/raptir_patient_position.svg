<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #D3DDE6; }</style>
<defs>
<linearGradient id="skin-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ECC8AE"/><stop offset="1" stop-color="#D3A386"/></linearGradient>
<linearGradient id="probe-body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9C0C7"/><stop offset="0.5" stop-color="#E9ECEF"/>
  <stop offset="1" stop-color="#C3CAD1"/></linearGradient>
</defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting"></g>
<g id="anatomy">
  <rect id="chest" x="0" y="0" width="1600" height="1200" fill="url(#skin-grad)"/>
  <path d="M-40,-40 C6.7,-93.3 485,-55 520,-40 C555,-25 405,109.2 380,140 C355,170.8 246.7,298.3 220,330 C193.3,361.7 81.7,497.5 60,520 C38.3,542.5 -31.7,646.7 -40,600 C-48.3,553.3 -86.7,13.3 -40,-40 Z" fill="#D3DDE6" stroke="#B98A74" stroke-width="3"/>
  <path id="neck" d="M1640,860 C1611.7,831.7 1346.7,888.3 1300,900 C1253.3,911.7 1106.7,971.7 1080,1000 C1053.3,1028.3 933.3,1220 980,1240 C1026.7,1260 1585,1271.7 1640,1240 C1695,1208.3 1668.3,888.3 1640,860 Z" fill="#DDB194" stroke="#B98A74" stroke-width="3"/>
  <path id="shoulder" d="M-40,600 C-31.7,540 40,528.3 60,520 C80,511.7 177.5,496.7 200,500 C222.5,503.3 313.3,543.3 330,560 C346.7,576.7 395.8,673.3 400,700 C404.2,726.7 388.3,850 380,880 C371.7,910 313.3,1030 300,1060 C286.7,1090 248.3,1225 220,1240 C191.7,1255 -18.3,1293.3 -40,1240 C-61.7,1186.7 -48.3,660 -40,600 Z" fill="#E6BB9F" stroke="#B98A74" stroke-width="3"/>
  <path id="clavicle-ridge" d="M260,760 C279.8,758.8 388,748.8 430,750 C472,751.2 574.5,764.2 620,770 C665.5,775.8 774.5,789.5 820,800 C865.5,810.5 987.8,853 1010,860" fill="none" stroke="#F2D3BF" stroke-width="26" stroke-linecap="round" opacity="0.8"/>
  <circle id="nipple" cx="1180" cy="230" r="24" fill="#B87F6C"/>
  <path d="M470,1010 C430,1090 310,1130 170,1240" fill="none" stroke="#E9EEF2" stroke-width="8" stroke-linecap="round"/>
  <rect x="460" y="1006" width="20" height="40" rx="6" fill="#F2F2F2" stroke="#8A9199" stroke-width="2"/>
  <line id="needle" x1="470" y1="1010" x2="500" y2="830" stroke="#8E969E" stroke-width="5"/>
  <circle id="needle-entry" cx="500" cy="830" r="5" fill="#9E6B5A"/>
  <path d="M570,-40 C580,-100 640,-140 700,-160" fill="none" stroke="#3E454C" stroke-width="18"/>
  <path id="probe-handle" d="M480,605 C484.2,616.2 549.5,616.2 555,605 C560.5,593.8 587.2,402.2 590,380 C592.8,357.8 608.5,181 610,160 C611.5,139 624.5,-30 620,-40 C615.5,-50 526,-50 520,-40 C514,-30 502.5,139 500,160 C497.5,181 471,357.8 470,380 C469,402.2 475.8,593.8 480,605 Z" fill="url(#probe-body)" stroke="#7D868F" stroke-width="3"/>
  <polygon id="probe" points="470,600 560,600 575,700 480,700" fill="#D5DADF" stroke="#7D868F" stroke-width="3"/>
</g>

<g class="marking">
  <path id="clavicle-mark" d="M260,760 C279.8,758.8 388,748.8 430,750 C472,751.2 574.5,764.2 620,770 C665.5,775.8 774.5,789.5 820,800 C865.5,810.5 987.8,853 1010,860" fill="none" stroke="#4A2F7A" stroke-width="6" stroke-dasharray="18 12"/>
</g>

<g id="labels"><g class="label" data-label="Clavicle" data-target="clavicle-mark"><polyline class="leader-halo" points="760,910 620,770"/><polyline class="leader" points="760,910 620,770"/><circle class="leader-dot" cx="620" cy="770" r="7"/><text x="700" y="960" text-anchor="start"><tspan x="700" dy="0">Clavicle</tspan></text></g><g class="label" data-label="Linear probe" data-target="probe-handle"><polyline class="leader-halo" points="780,400 560,330"/><polyline class="leader" points="780,400 560,330"/><circle class="leader-dot" cx="560" cy="330" r="7"/><text x="780" y="420" text-anchor="start"><tspan x="780" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="260,1110 485,920"/><polyline class="leader" points="260,1110 485,920"/><circle class="leader-dot" cx="485" cy="920" r="7"/><text x="40" y="1150" text-anchor="start"><tspan x="40" dy="0">Block needle</tspan></text></g></g>

</svg>
