  <polygon id="cricothyroid-membrane" points="658.7,474.1 939.9,474.1 953.3,589.3 642.7,589.3" fill="#0E8C98" fill-opacity="0.22" stroke="#0E8C98" stroke-width="3" stroke-opacity="0.8"/>
  <polygon id="cricoid-cartilage" points="637.3,593.3 964,593.3 958.7,665.6 642.7,665.6" fill="#000" fill-opacity="0"/>
  <polygon id="tracheal-rings" points="664.1,676.3 937.2,676.3 937.2,1191.8 664.1,1191.8" fill="#000" fill-opacity="0"/>
  <polygon id="thyroid-isthmus" points="696.2,756.7 903.8,756.7 937.2,857.1 910.5,924 689.5,924 662.8,857.1" fill="#000" fill-opacity="0"/>

  <line id="vertical-skin-incision" x1="799.3" y1="388.5" x2="799.3" y2="897.2"
        stroke="#D8432A" stroke-width="7" stroke-dasharray="22 15" stroke-linecap="round" opacity="0.92"/>
  <line id="membrane-incision" x1="729.7" y1="542.4" x2="870.3" y2="542.4"
        stroke="#D8432A" stroke-width="12" stroke-linecap="round"/>
</g>

<g id="labels"><g class="label" data-label="Thyroid cartilage" data-target="thyroid-cartilage"><polyline class="leader-halo" points="290,290 629.3,308.1"/><polyline class="leader" points="290,290 629.3,308.1"/><circle class="leader-dot" cx="629.3" cy="308.1" r="7"/><text x="40" y="250" text-anchor="start"><tspan x="40" dy="0">Thyroid</tspan><tspan x="40" dy="66">cartilage</tspan></text></g><g class="label emphasis" data-label="Cricothyroid membrane" data-target="cricothyroid-membrane"><polyline class="leader-halo" points="400,548 676.2,535.7"/><polyline class="leader" points="400,548 676.2,535.7"/><circle class="leader-dot" cx="676.2" cy="535.7" r="7"/><text x="30" y="560" text-anchor="start"><tspan x="30" dy="0">Cricothyroid</tspan><tspan x="30" dy="66">membrane</tspan></text></g><g class="label" data-label="Cricoid cartilage" data-target="cricoid-cartilage"><polyline class="leader-halo" points="1280,590 943.9,629.5"/><polyline class="leader" points="1280,590 943.9,629.5"/><circle class="leader-dot" cx="943.9" cy="629.5" r="7"/><text x="1290" y="560" text-anchor="start"><tspan x="1290" dy="0">Cricoid</tspan><tspan x="1290" dy="66">cartilage</tspan></text></g></g>

</svg>
