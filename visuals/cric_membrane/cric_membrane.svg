    <path id="thyroid-isthmus" d="M684,704 C697.7,691.8 734,695.7 760,694 C786,692.3 814,692.3 840,694 C866,695.7 902.3,691.8 916,704 C929.7,716.2 922.7,745.7 922,767 C921.3,788.3 925.7,818.8 912,832 C898.3,845.2 865.3,843.7 840,846 C814.7,848.3 785.3,848.3 760,846 C734.7,843.7 701.7,845.2 688,832 C674.3,818.8 678.7,788.3 678,767 C677.3,745.7 670.3,716.2 684,704 Z" fill="#F2B9A8" fill-opacity="0.85" stroke="#C98774" stroke-width="2.5"/>
  </g>

  <line id="vertical-skin-incision" x1="800" y1="121" x2="800" y2="931"
        stroke="#D8432A" stroke-width="6" stroke-dasharray="20 14" stroke-linecap="round" opacity="0.85"/>
  <line id="membrane-incision" x1="738" y1="532" x2="862" y2="532"
        stroke="#D8432A" stroke-width="11" stroke-linecap="round"/>
</g>

<g id="labels"><g class="label" data-label="Thyroid cartilage" data-target="thyroid-cartilage"><polyline class="leader-halo" points="330,350 690,380"/><polyline class="leader" points="330,350 690,380"/><circle class="leader-dot" cx="690" cy="380" r="7"/><text x="60" y="330" text-anchor="start"><tspan x="60" dy="0">Thyroid</tspan><tspan x="60" dy="66">cartilage</tspan></text></g><g class="label emphasis" data-label="Cricothyroid membrane" data-target="cricothyroid-membrane"><polyline class="leader-halo" points="420,545 740,540"/><polyline class="leader" points="420,545 740,540"/><circle class="leader-dot" cx="740" cy="540" r="7"/><text x="40" y="560" text-anchor="start"><tspan x="40" dy="0">Cricothyroid</tspan><tspan x="40" dy="66">membrane</tspan></text></g><g class="label" data-label="Cricoid cartilage" data-target="cricoid-cartilage"><polyline class="leader-halo" points="1290,600 910,600"/><polyline class="leader" points="1290,600 910,600"/><circle class="leader-dot" cx="910" cy="600" r="7"/><text x="1300" y="580" text-anchor="start"><tspan x="1300" dy="0">Cricoid</tspan><tspan x="1300" dy="66">cartilage</tspan></text></g></g>

</svg>
