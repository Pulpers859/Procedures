  <path d="M300,0 C420,110 600,150 800,152 C1000,150 1180,110 1300,0" fill="#F9ECE3" stroke="#D8B4A0" stroke-width="3"/>
  <path d="M560,1150 Q700,1120 800,1140 Q900,1120 1040,1150" fill="none" stroke="#D8B4A0" stroke-width="3"/>

