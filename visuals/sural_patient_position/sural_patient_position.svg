  <path id="achilles" d="M340,40 C342.1,56.7 361.7,208.8 365,240 C368.3,271.2 379.6,387.9 380,415 C380.4,442.1 373.8,542.9 370,565 C366.2,587.1 337.9,670.4 335,680" fill="none" stroke="#D2A288" stroke-width="22" stroke-linecap="round"/>
  <ellipse id="lat-malleolus" cx="505" cy="615" rx="55" ry="65" fill="#E2B39A" stroke="#C49379" stroke-width="2"/>
  <path d="M715,510 C805,490 875,370 975,-40" fill="none" stroke="#E9EEF2" stroke-width="9" stroke-linecap="round"/>
  <rect x="711" y="501" width="38" height="18" rx="5" fill="#F2F2F2" stroke="#8A9199" stroke-width="2"/>
  <line id="needle" x1="715" y1="510" x2="580" y2="530" stroke="#8E969E" stroke-width="5"/>
  <circle id="needle-entry" cx="580" cy="530" r="4" fill="#9E6B5A"/>
