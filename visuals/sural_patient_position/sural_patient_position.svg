</g>

<g id="labels"><g class="label" data-label="Lateral malleolus" data-target="lat-malleolus"><polyline class="leader-halo" points="790,740 515,625"/><polyline class="leader" points="790,740 515,625"/><circle class="leader-dot" cx="515" cy="625" r="7"/><text x="760" y="800" text-anchor="start"><tspan x="760" dy="0">Lateral</tspan><tspan x="760" dy="66">malleolus</tspan></text></g><g class="label" data-label="Achilles tendon" data-target="achilles"><polyline class="leader-halo" points="150,700 370,565"/><polyline class="leader" points="150,700 370,565"/><circle class="leader-dot" cx="370" cy="565" r="7"/><text x="40" y="760" text-anchor="start"><tspan x="40" dy="0">Achilles</tspan><tspan x="40" dy="66">tendon</tspan></text></g><g class="label" data-label="Linear probe" data-target="probe"><polyline class="leader-halo" points="300,170 460,530"/><polyline class="leader" points="300,170 460,530"/><circle class="leader-dot" cx="460" cy="530" r="7"/><text x="40" y="150" text-anchor="start"><tspan x="40" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="1060,320 647.5,520"/><polyline class="leader" points="1060,320 647.5,520"/><circle class="leader-dot" cx="647.5" cy="520" r="7"/><text x="1000" y="300" text-anchor="start"><tspan x="1000" dy="0">Block needle</tspan></text></g></g>

</svg>
