<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #F4F3EF; }</style>
<defs><filter id="feather-3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<mask id="m-body" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="896"><image href="../distribution_bases/head/mask_body.png" x="0" y="0" width="1200" height="896" preserveAspectRatio="none"/></mask>
<mask id="m-bone" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="896"><image href="../distribution_bases/head/mask_bone.png" x="0" y="0" width="1200" height="896" preserveAspectRatio="none"/></mask>
<clipPath id="c-ear"><path d="M690,250 C695,243 835,243 840,250 C845,257 845,453 840,460 C835,467 695,467 690,460 C685,453 685,257 690,250 Z"/></clipPath></defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting" data-base-sha256="5b8e1aa87552e2c02a3a38ed80a8b72ae261fe9aedcef860e8ef8a07612793ce">
  <image id="base" href="../distribution_bases/head/base.jpg" x="0" y="2.7" width="1600" height="1194.7" preserveAspectRatio="none"/>
</g>
<g class="marking" transform="translate(0 2.7) scale(1.333333)">
    <g clip-path="url(#c-ear)" style="mix-blend-mode:multiply"><g mask="url(#m-body)"><g filter="url(#feather-3)"><path id="auricle-skin" d="M716,322 C717.6,317.9 741.7,291.8 746,290 C750.3,288.2 786.9,290 790,292 C793.1,294 799.3,320 800,324 C800.7,328 802,355.4 802,360 C802,364.6 800.9,398.3 800,402 C799.1,405.7 788.7,422.7 786,424 C783.3,425.3 757.4,425.6 754,424 C750.6,422.4 730.1,399.7 728,396 C725.9,392.3 718.7,364.3 718,360 C717.3,355.7 714.4,326.1 716,322 Z" fill="#2E9C97" fill-opacity="0.6"/></g></g></g>
</g>

</svg>
