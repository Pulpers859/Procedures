  <polygon id="parietal-pleura" points="1013.3,442.8 1014.7,536.7 1024,584.2 1017,614.4 986.2,654.8 956.5,746.5 974.2,752.2 1003.1,662.6 1033.6,623 1042.7,583.8 1033.3,535.3 1032,442.5" fill="#000" fill-opacity="0"/>
  <polygon id="measured-depth" points="397.3,691.3 1040,691.3 1040,670 397.3,670" fill="#000" fill-opacity="0"/>
  <circle id="dilator-tip" cx="1024" cy="596" r="6" fill="#000" fill-opacity="0"/>
</g>

<g id="labels"><g class="label emphasis" data-label="Parietal pleura" data-target="parietal-pleura"><polyline class="leader-halo" points="1150,190 1024,533.3"/><polyline class="leader" points="1150,190 1024,533.3"/><circle class="leader-dot" cx="1024" cy="533.3" r="7"/><text x="1010" y="170" text-anchor="start"><tspan x="1010" dy="0">Parietal pleura</tspan></text></g><g class="label" data-label="Measured depth" data-target="measured-depth"><polyline class="leader-halo" points="200,845 480,680.7"/><polyline class="leader" points="200,845 480,680.7"/><circle class="leader-dot" cx="480" cy="680.7" r="7"/><text x="48" y="900" text-anchor="start"><tspan x="48" dy="0">Measured</tspan><tspan x="48" dy="66">depth</tspan></text></g></g>

</svg>
