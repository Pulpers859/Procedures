<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #F4F3EF; }</style>
<defs><filter id="feather-8" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
<mask id="m-body" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="896"><image href="../distribution_bases/head_back/mask_body.png" x="0" y="0" width="1200" height="896" preserveAspectRatio="none"/></mask>
<mask id="m-bone" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="896"><image href="../distribution_bases/head_back/mask_bone.png" x="0" y="0" width="1200" height="896" preserveAspectRatio="none"/></mask>
<clipPath id="c-right-scalp"><path d="M880,60 C887.3,46.3 1092.7,46.3 1100,60 C1107.3,73.7 1107.3,456.3 1100,470 C1092.7,483.7 887.3,483.7 880,470 C872.7,456.3 872.7,73.7 880,60 Z"/></clipPath>
<linearGradient id="fade-gon-skin" gradientUnits="userSpaceOnUse" x1="940" y1="92" x2="940" y2="165"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#FFF"/></linearGradient><mask id="m-fade-gon-skin" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="896"><rect width="1200" height="896" fill="url(#fade-gon-skin)"/></mask></defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting" data-base-sha256="0e9d9c074d90155acfd1fd5cf36ca0ae116a2582f74c189e8b97c2c47fd845b0">
  <image id="base" href="../distribution_bases/head_back/base.jpg" x="0" y="2.7" width="1600" height="1194.7" preserveAspectRatio="none"/>
</g>
<g class="marking" transform="translate(0 2.7) scale(1.333333)">
    <g clip-path="url(#c-right-scalp)" style="mix-blend-mode:multiply"><g mask="url(#m-body)"><g mask="url(#m-fade-gon-skin)"><g filter="url(#feather-8)"><path id="gon-skin" d="M878,100 C880.7,81.1 919.9,102.4 925,104 C930.1,105.6 961.1,123.6 965,128 C968.9,132.4 990.1,172.9 992,180 C993.9,187.1 997.8,241.2 998,250 C998.2,258.8 995.9,322.1 995,330 C994.1,337.9 984.2,380.2 982,385 C979.8,389.8 961.5,409.6 958,412 C954.5,414.4 926.7,425.1 922,426 C917.3,426.9 880.6,447 878,428 C875.4,409 875.3,118.9 878,100 Z" fill="#2E9C97" fill-opacity="0.6"/></g></g></g></g>
</g>

</svg>
