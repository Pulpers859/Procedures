  <line id="redirect" x1="448" y1="448" x2="816" y2="560" stroke="#5E6670" stroke-width="6" stroke-dasharray="16 12" opacity="0.85"/>
  <line id="needle" x1="273.2" y1="368.5" x2="624" y2="528" stroke="#5E6670" stroke-width="7"/>
  <line x1="273.2" y1="368.5" x2="624" y2="528" stroke="#D9DEE3" stroke-width="3"/>
  <circle id="needle-tip" cx="624" cy="528" r="5" fill="#5E6670"/>
  <circle id="redirect-tip" cx="816" cy="560" r="5" fill="#5E6670" opacity="0.85"/>
  <circle id="needle-entry" cx="448" cy="448" r="9" fill="#D8432A" stroke="#F6F7F9" stroke-width="3"/>
</g>

<g id="labels"><g class="label emphasis" data-label="Supraorbital notch" data-target="notch"><polyline class="leader-halo" points="260,860 618,653.6"/><polyline class="leader" points="260,860 618,653.6"/><circle class="leader-dot" cx="618" cy="653.6" r="7"/><text x="40" y="900" text-anchor="start"><tspan x="40" dy="0">Supraorbital</tspan><tspan x="40" dy="66">notch</tspan></text></g><g class="label" data-label="Supratrochlear nerve" data-target="supratrochlear"><polyline class="leader-halo" points="1120,190 841.6,320"/><polyline class="leader" points="1120,190 841.6,320"/><circle class="leader-dot" cx="841.6" cy="320" r="7"/><text x="1110" y="150" text-anchor="start"><tspan x="1110" dy="0">Supratrochlear</tspan><tspan x="1110" dy="66">nerve</tspan></text></g><g class="label" data-label="Orbit" data-target="orbit"><polyline class="leader-halo" points="640,1100 544,992"/><polyline class="leader" points="640,1100 544,992"/><circle class="leader-dot" cx="544" cy="992" r="7"/><text x="560" y="1150" text-anchor="start"><tspan x="560" dy="0">Orbit</tspan></text></g></g>

</svg>
