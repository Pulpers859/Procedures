  <ellipse id="notch" cx="624" cy="649.6" rx="28.8" ry="20.8" fill="#3E2F25" stroke="#8C7A5E" stroke-width="3"/>
  <ellipse id="trochlear-notch" cx="816" cy="665.6" rx="19.2" ry="14.4" fill="#5A4636" stroke="#8C7A5E" stroke-width="2"/>
</g>

