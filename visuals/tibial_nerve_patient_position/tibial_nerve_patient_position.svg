<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #DDE5EC; }</style>
<defs>
<linearGradient id="skin-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D9A88C"/><stop offset="0.3" stop-color="#EBC3AA"/>
  <stop offset="0.7" stop-color="#F0CDB6"/><stop offset="1" stop-color="#E2B69C"/></linearGradient>
<linearGradient id="sheet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8EEF3"/><stop offset="1" stop-color="#D3DDE6"/></linearGradient>
<linearGradient id="probe-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9ECEF"/><stop offset="1" stop-color="#B9C0C7"/></linearGradient>
</defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting"></g>
<g id="anatomy">
  <rect x="0" y="0" width="1600" height="1200" fill="url(#sheet)"/>
  <path id="foot" d="M1280,-60 C1304.7,-46.7 1262.3,114 1260,140 C1257.7,166 1246,307.3 1245,330 C1244,352.7 1244,462 1245,480 C1246,498 1256.3,584.7 1260,600 C1263.7,615.3 1295.3,696 1300,710 C1304.7,724 1328,798 1330,810 C1332,822 1332.7,880.7 1330,890 C1327.3,899.3 1298,944 1290,950 C1282,956 1224,978 1210,980 C1196,982 1098,981.7 1080,980 C1062,978.3 958.3,958.7 940,955 C921.7,951.3 824,926.7 805,925 C786,923.3 675,926.3 655,930 C635,933.7 525,975 505,980 C485,985 374,1003 355,1005 C336,1007 237,1011 220,1010 C203,1009 112,994 100,990 C88,986 42.7,956 40,950 C37.3,944 50.7,905.3 60,900 C69.3,894.7 158.7,874.7 180,870 C201.3,865.3 353.3,838 380,830 C406.7,822 555.3,761.3 580,750 C604.7,738.7 731.3,672.7 750,660 C768.7,647.3 849.3,574 860,560 C870.7,546 906,468 910,450 C914,432 920,312.3 920,290 C920,267.7 912,138.3 910,115 C908,91.7 865.3,-48.3 890,-60 C914.7,-71.7 1255.3,-73.3 1280,-60 Z" fill="url(#skin-grad)" stroke="#B98A74" stroke-width="3"/>
  <path id="achilles" d="M1260,40 C1257.9,56.7 1238.3,208.8 1235,240 C1231.7,271.2 1220.4,387.9 1220,415 C1219.6,442.1 1226.2,542.9 1230,565 C1233.8,587.1 1262.1,670.4 1265,680" fill="none" stroke="#D2A288" stroke-width="22" stroke-linecap="round"/>
  <ellipse id="med-malleolus" cx="1070" cy="570" rx="65" ry="80" fill="#E2B39A" stroke="#C49379" stroke-width="2"/>
  <path d="M1365,510 C1455,490 1525,370 1625,-40" fill="none" stroke="#E9EEF2" stroke-width="9" stroke-linecap="round"/>
  <rect x="1361" y="501" width="38" height="18" rx="5" fill="#F2F2F2" stroke="#8A9199" stroke-width="2"/>
  <line id="needle" x1="1365" y1="510" x2="1232.5" y2="530" stroke="#8E969E" stroke-width="5"/>
  <circle id="needle-entry" cx="1232.5" cy="530" r="4" fill="#9E6B5A"/>
  <path id="probe-handle" d="M1040,514 C1055,470 1085,410 1090,310 L1150,310 C1155,410 1185,470 1200,514 Z" fill="url(#probe-body)" stroke="#7D868F" stroke-width="3"/>
  <path d="M1120,310 C1110,250 1020,180 920,-20" fill="none" stroke="#3E454C" stroke-width="14" stroke-linecap="round"/>
  <rect id="probe" x="1025" y="510" width="190" height="40" rx="16" fill="url(#probe-body)" stroke="#7D868F" stroke-width="3"/>
</g>

<g id="labels"><g class="label" data-label="Medial malleolus" data-target="med-malleolus"><polyline class="leader-halo" points="760,740 1060,600"/><polyline class="leader" points="760,740 1060,600"/><circle class="leader-dot" cx="1060" cy="600" r="7"/><text x="560" y="800" text-anchor="start"><tspan x="560" dy="0">Medial</tspan><tspan x="560" dy="66">malleolus</tspan></text></g><g class="label" data-label="Achilles tendon" data-target="achilles"><polyline class="leader-halo" points="1360,700 1230,565"/><polyline class="leader" points="1360,700 1230,565"/><circle class="leader-dot" cx="1230" cy="565" r="7"/><text x="1340" y="760" text-anchor="start"><tspan x="1340" dy="0">Achilles</tspan><tspan x="1340" dy="66">tendon</tspan></text></g><g class="label" data-label="Linear probe" data-target="probe"><polyline class="leader-halo" points="800,170 1120,530"/><polyline class="leader" points="800,170 1120,530"/><circle class="leader-dot" cx="1120" cy="530" r="7"/><text x="520" y="150" text-anchor="start"><tspan x="520" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="1380,330 1298.8,520"/><polyline class="leader" points="1380,330 1298.8,520"/><circle class="leader-dot" cx="1298.8" cy="520" r="7"/><text x="1340" y="300" text-anchor="start"><tspan x="1340" dy="0">Block</tspan><tspan x="1340" dy="66">needle</tspan></text></g></g>

</svg>
