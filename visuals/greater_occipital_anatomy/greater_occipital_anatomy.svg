<g id="labels"><g class="label emphasis" data-label="Greater occipital nerve" data-target="gon"><polyline class="leader-halo" points="330,180 754,260"/><polyline class="leader" points="330,180 754,260"/><circle class="leader-dot" cx="754" cy="260" r="7"/><text x="60" y="140" text-anchor="start"><tspan x="60" dy="0">Greater occipital</tspan><tspan x="60" dy="66">nerve</tspan></text></g><g class="label" data-label="Occipital artery" data-target="occipital-artery"><polyline class="leader-halo" points="1150,140 842,172"/><polyline class="leader" points="1150,140 842,172"/><circle class="leader-dot" cx="842" cy="172" r="7"/><text x="1060" y="120" text-anchor="start"><tspan x="1060" dy="0">Occipital artery</tspan></text></g><g class="label" data-label="External occipital protuberance" data-target="eop"><polyline class="leader-halo" points="250,960 537,708"/><polyline class="leader" points="250,960 537,708"/><circle class="leader-dot" cx="537" cy="708" r="7"/><text x="40" y="1000" text-anchor="start"><tspan x="40" dy="0">External occipital</tspan><tspan x="40" dy="66">protuberance</tspan></text></g><g class="label" data-label="Mastoid" data-target="mastoid"><polyline class="leader-halo" points="1380,1110 1304,986"/><polyline class="leader" points="1380,1110 1304,986"/><circle class="leader-dot" cx="1304" cy="986" r="7"/><text x="1330" y="1150" text-anchor="start"><tspan x="1330" dy="0">Mastoid</tspan></text></g><g class="label" data-label="Superior nuchal line" data-target="nuchal-line"><polyline class="leader-halo" points="1100,650 1073,744"/><polyline class="leader" points="1100,650 1073,744"/><circle class="leader-dot" cx="1073" cy="744" r="7"/><text x="980" y="620" text-anchor="start"><tspan x="980" dy="0">Superior nuchal line</tspan></text></g><g class="label" data-label="One-third" data-target="third-mark"><polyline class="leader-halo" points="760,960 779.7,736"/><polyline class="leader" points="760,960 779.7,736"/><circle class="leader-dot" cx="779.7" cy="736" r="7"