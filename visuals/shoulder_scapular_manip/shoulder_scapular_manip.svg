<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<style>
@font-face { font-family: "Plate Sans"; font-weight: 500; src: url("../fonts/inter-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Plate Sans"; font-weight: 700; src: url("../fonts/inter-latin-700-normal.woff2") format("woff2"); }
svg {
  --bg: #F6F7F9;
  --ink: #1C2530;
  --skin-hi: #F7E3D4; --skin: #EDCDB8; --skin-lo: #D9AE95; --skin-deep: #C48F75;
  --lid-line: #7A4E3E; --lash: #3B2A24; --brow: #6B4A3A;
  --sclera: #FBFBF8; --sclera-shade: #E4E2DC;
  --iris-hi: #7FA7A1; --iris: #4F7C78; --iris-lo: #2E4F4D; --pupil: #141A1C;
  --caruncle: #E39A95;
  --bone: #EFE6D2; --bone-edge: #A8977A;
  --deep-grey: #8B8F96;
  --target: #0E8C98; --target-fill: rgba(14, 140, 152, 0.38);
  --danger: #D8432A; --danger-soft: #F08A73;
  --halo: rgba(246, 247, 249, 0.92);
  font-family: "Plate Sans", "Inter", "Helvetica Neue", Arial, sans-serif;
}
/* Dark mode: plates are full-bleed, so labels sit on the art, not on the page.
   Keep the label colours and dim the art a little so it does not glare in a
   dark card. A plate that leaves open background would override --bg here. */
svg.dark { --bg: #16191E; }
svg.dark #anatomy { filter: brightness(0.86) saturate(0.95); }
.plate-bg { fill: var(--bg); }
.label text { font-size: 56px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 14px; stroke-linejoin: round; }
.label.emphasis text { font-weight: 700; fill: var(--target); }
.leader { fill: none; stroke: var(--ink); stroke-width: 3; }
.label.emphasis .leader { stroke: var(--target); stroke-width: 4; }
.leader-halo { fill: none; stroke: var(--halo); stroke-width: 11; stroke-linecap: round; }
.leader-dot { fill: var(--ink); stroke: var(--halo); stroke-width: 4; }
.label.emphasis .leader-dot { fill: var(--target); }
.plate-bg { fill: #C9D3DC; }</style>
<defs>
<linearGradient id="skin-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDCDB8"/><stop offset="1" stop-color="#D9AE95"/></linearGradient>
<linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4E9EE"/><stop offset="1" stop-color="#F4F6F8"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#0E8C98"/></marker>
</defs>
<rect class="plate-bg" width="1600" height="1200"/>

<g id="painting" data-base-sha256="5aa7475c3887cc23503fb32a79304d64a675c0b95e56d60e63163071a06b9ef3"><image href="base.jpg" x="0" y="2.7" width="1600" height="1194.7" preserveAspectRatio="none"/></g>
<g id="anatomy" opacity="0">
  <rect x="0" y="0" width="1600" height="1200" fill="#C9D3DC"/>
  <rect x="0" y="660" width="1600" height="540" fill="#9AA6B1"/>
  <rect id="mattress" x="-10" y="230" width="1620" height="350" fill="url(#sheet)" stroke="#B9C2CB" stroke-width="3"/>
  <rect x="-10" y="580" width="1620" height="80" fill="#5E6E7C"/>
  <path id="back" d="M-40,330 C-15.8,304.6 188.3,308.3 250,305 C311.7,301.7 633.3,292.1 700,290 C766.7,287.9 1012.5,279.2 1050,280 C1087.5,280.8 1136.7,291.7 1150,300 C1163.3,308.3 1204.6,361.7 1210,380 C1215.4,398.3 1224.2,501.7 1215,520 C1205.8,538.3 1121.2,593.5 1100,600 C1078.8,606.5 993.3,597.2 960,598 C926.7,598.8 755,608.8 700,610 C645,611.2 361.7,612 300,612 C238.3,612 -11.7,633.5 -40,610 C-68.3,586.5 -64.2,355.4 -40,330 Z" fill="url(#skin-grad)" stroke="#B98A74" stroke-width="3"/>
  <path d="M1150,330 C1157,317.5 1236.5,336 1250,345 C1263.5,354 1285,404.5 1285,420 C1285,435.5 1260.5,495 1250,500 C1239.5,505 1190,487 1180,470 C1170,453 1143,342.5 1150,330 Z" fill="#E3BCA4" stroke="#B98A74" stroke-width="3"/>
  <ellipse id="head" cx="1400" cy="360" rx="110" ry="100" fill="#5A4234" stroke="#3E2C22" stroke-width="3"/>
  <ellipse id="ear" cx="1400" cy="470" rx="26" ry="38" fill="#D9A88C" stroke="#A9765F" stroke-width="3"/>
  <path id="shorts" d="M-40,320 C-26.5,305 215.5,295.2 230,310 C244.5,324.8 263.5,600 250,615 C236.5,630 -25.5,624.8 -40,610 C-54.5,595.2 -53.5,335 -40,320 Z" fill="#3F5F7F" stroke="#2E4660" stroke-width="3"/>
  <path id="arm" d="M1150,380 C1163.1,376.7 1203.7,416.1 1207,440 C1210.3,463.9 1200.6,632.6 1190,667 C1179.4,701.4 1090.2,824.2 1080,853 C1069.8,881.8 1067,980.8 1067,1013 C1067,1045.2 1091.2,1221.1 1080,1240 C1068.8,1258.9 946.3,1254.4 933,1240 C919.7,1225.6 922.2,1094.8 920,1067 C917.8,1039.2 905.9,933.7 907,907 C908.1,880.3 928.6,773.2 933,747 C937.4,720.8 950.2,615.2 960,593 C969.8,570.8 1034.2,497.8 1050,480 C1065.8,462.2 1136.9,383.3 1150,380 Z" fill="url(#skin-grad)" stroke="#B98A74" stroke-width="3"/>
</g>

<g class="marking">
  <path id="scapula" d="M1090,302 C1075.8,298.5 999.2,311.7 980,318 C960.8,324.3 864.2,369.5 860,378 C855.8,386.5 915,412.3 930,420 C945,427.7 1023.3,462.9 1040,470 C1056.7,477.1 1118.8,506.7 1130,505 C1141.2,503.3 1173.3,462.1 1175,450 C1176.7,437.9 1157.1,372.3 1150,360 C1142.9,347.7 1104.2,305.5 1090,302 Z" fill="#FFFFFF" fill-opacity="0.30" stroke="#8C7458" stroke-width="4" stroke-linejoin="round"/>
  <path d="M1075,318 C1080.5,323.2 1118.5,359.8 1130,370 C1141.5,380.2 1184,415 1190,420" fill="none" stroke="#8C7458" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <path id="spine-line" d="M260,312 C294,310.8 536,302 600,300 C664,298 852,293 900,292 C948,291 1055,289.2 1080,290 C1105,290.8 1143,299 1150,300" fill="none" stroke="#4A2F7A" stroke-width="5" stroke-dasharray="18 12"/>
  <path id="tip-arrow" d="M880,470 C820,450 800,390 830,330" fill="none" stroke="#0E8C98" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line id="traction" x1="996" y1="930" x2="1004" y2="1170" stroke="#0E8C98" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/>
</g>

<g id="labels"><g class="label emphasis" data-label="Rotate the tip toward the spine" data-target="tip-arrow"><polyline class="leader-halo" points="560,190 821,415"/><polyline class="leader" points="560,190 821,415"/><circle class="leader-dot" cx="821" cy="415" r="7"/><text x="300" y="130" text-anchor="start"><tspan x="300" dy="0">Rotate the tip</tspan><tspan x="300" dy="66">toward the spine</tspan></text></g><g class="label" data-label="Spine" data-target="spine-line"><polyline class="leader-halo" points="140,250 260,312"/><polyline class="leader" points="140,250 260,312"/><circle class="leader-dot" cx="260" cy="312" r="7"/><text x="40" y="230" text-anchor="start"><tspan x="40" dy="0">Spine</tspan></text></g><g class="label" data-label="Scapula" data-target="scapula"><polyline class="leader-halo" points="1150,170 1040,420"/><polyline class="leader" points="1150,170 1040,420"/><circle class="leader-dot" cx="1040" cy="420" r="7"/><text x="1100" y="150" text-anchor="start"><tspan x="1100" dy="0">Scapula</tspan></text></g><g class="label" data-label="Arm hangs, gentle traction" data-target="traction"><polyline class="leader-halo" points="840,1040 1002,1060"/><polyline class="leader" points="840,1040 1002,1060"/><circle class="leader-dot" cx="1002" cy="1060" r="7"/><text x="440" y="1060" text-anchor="start"><tspan x="440" dy="0">Arm hangs,</tspan><tspan x="440" dy="66">gentle traction</tspan></text></g></g>

</svg>
