  <path d="M800,12 C812,-60 920,-108 1160,0" fill="none" stroke="#3E454C" stroke-width="12" stroke-linecap="round"/>
  <rect id="probe" x="692" y="333" width="216" height="54" rx="15" fill="url(#probe-body)" stroke="#7D868F" stroke-width="3"/>
  <path d="M476,360 C396,360 336,440 296,620" fill="none" stroke="#E9EEF2" stroke-width="8" stroke-linecap="round"/>
  <rect x="446" y="352" width="34" height="16" rx="5" fill="#F2F2F2" stroke="#8A9199" stroke-width="2"/>
