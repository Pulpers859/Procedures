<g id="labels"><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="200,280 579.8,358"/><polyline class="leader" points="200,280 579.8,358"/><circle class="leader-dot" cx="579.8" cy="358" r="7"/><text x="40" y="250" text-anchor="start"><tspan x="40" dy="0">Block needle</tspan></text></g><g class="label" data-label="Linear probe" data-target="probe"><polyline class="leader-halo" points="1120,440 888,360"/><polyline class="leader" points="1120,440 888,360"/><circle class="leader-dot" cx="888" cy="360" r="7"/><text x="1110" y="470" text-anchor="start"><tspan x="1110" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Thenar eminence" data-target="thenar"><polyline class="leader-halo" points="340,1050 728,1158"/><polyline class="leader" points="340,1050 728,1158"/><circle class="leader-dot" cx="728" cy="1158" r="7"/><text x="40" y="1060" text-anchor="start"><tspan x="40" dy="0">Thenar eminence</tspan></text></g></g>

</svg>
