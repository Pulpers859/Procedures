</g>

<g id="labels"><g class="label" data-label="Lateral malleolus" data-target="lat-malleolus"><polyline class="leader-halo" points="350,500 690,468"/><polyline class="leader" points="350,500 690,468"/><circle class="leader-dot" cx="690" cy="468" r="7"/><text x="140" y="560" text-anchor="start"><tspan x="140" dy="0">Lateral</tspan><tspan x="140" dy="66">malleolus</tspan></text></g><g class="label" data-label="Linear probe" data-target="probe"><polyline class="leader-halo" points="370,160 721,225"/><polyline class="leader" points="370,160 721,225"/><circle class="leader-dot" cx="721" cy="225" r="7"/><text x="80" y="140" text-anchor="start"><tspan x="80" dy="0">Linear probe</tspan></text></g><g class="label" data-label="Block needle" data-target="needle"><polyline class="leader-halo" points="1160,160 875,219"/><polyline class="leader" points="1160,160 875,219"/><circle class="leader-dot" cx="875" cy="219" r="7"/><text x="1080" y="140" text-anchor="start"><tspan x="1080" dy="0">Block needle</tspan></text></g></g>

</svg>
