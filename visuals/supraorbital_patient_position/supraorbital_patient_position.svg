  <circle id="notch-mark" cx="528" cy="540" r="24" fill="none" stroke="#4A2F7A" stroke-width="6" stroke-dasharray="10 7"/>
  <circle id="supratrochlear-mark" cx="672" cy="549.6" r="18" fill="none" stroke="#4A2F7A" stroke-width="5" stroke-dasharray="8 6"/>
