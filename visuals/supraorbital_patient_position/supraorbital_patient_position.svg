  <path id="finger" d="M-180,559.2 C-132,545.8 228,567.6 300,568.8 C372,570 501.6,570.5 540,571.2 C578.4,571.9 664.3,573.1 684,576 C703.7,578.9 731.3,592.8 736.8,600 C742.3,607.2 743.3,640.1 739.2,648 C735.1,655.9 715.9,675.1 696,679.2 C676.1,683.3 579.6,687.4 540,688.8 C500.4,690.2 372,692.2 300,693.6 C228,695 -132,716.6 -180,703.2 C-228,689.8 -228,572.6 -180,559.2 Z" fill="url(#glove)" stroke="#9AA6B2" stroke-width="3"/>
</g>

