  <line id="redirect" x1="396" y1="396" x2="672" y2="480" stroke="#5E6670" stroke-width="5" stroke-dasharray="14 10" opacity="0.85"/>
  <line id="needle" x1="264.9" y1="336.4" x2="528" y2="456" stroke="#5E6670" stroke-width="6"/>
  <line x1="264.9" y1="336.4" x2="528" y2="456" stroke="#D9DEE3" stroke-width="2.5"/>
