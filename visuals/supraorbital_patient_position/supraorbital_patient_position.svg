</g>

<g id="labels"><g class="label emphasis" data-label="Supraorbital notch" data-target="notch-mark"><polyline class="leader-halo" points="1060,210 544,526"/><polyline class="leader" points="1060,210 544,526"/><circle class="leader-dot" cx="544" cy="526" r="7"/><text x="1060" y="150" text-anchor="start"><tspan x="1060" dy="0">Supraorbital</tspan><tspan x="1060" dy="66">notch</tspan></text></g><g class="label" data-label="Supratrochlear nerve" data-target="supratrochlear-mark"><polyline class="leader-halo" points="1080,960 684,561.6"/><polyline class="leader" points="1080,960 684,561.6"/><circle class="leader-dot" cx="684" cy="561.6" r="7"/><text x="1060" y="1010" text-anchor="start"><tspan x="1060" dy="0">Supratrochlear</tspan><tspan x="1060" dy="66">nerve</tspan></text></g></g>

</svg>
